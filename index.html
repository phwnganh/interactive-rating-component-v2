<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Overpass:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./src/styles/style.css">
  <title>Frontend Mentor | Interactive rating component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="page">
    <section class="rating-card">
      <div class="rating-card__icon">
        <img src="./images/icon-star.svg" alt="star-icon"/>
      </div>

      <div class="rating-card__content">
        <h1 class="rating-card__title">How did we do?</h1>
        <p class="rating-card__description">Please let us know how we did with your support request. All feedback is appreciated
          to help us improve our offering!</p>
        <div class="rating-card__options">
          <button class="rating-card__option" data-rating="1">1</button>
          <button class="rating-card__option" data-rating="2">2</button>
          <button class="rating-card__option" data-rating="3">3</button>
          <button class="rating-card__option" data-rating="4">4</button>
          <button class="rating-card__option" data-rating="5">5</button>
        </div>
      </div>

      <button class="rating-card__submit">
        Submit
      </button>
    </section>

    <script type="module" src="./src/js/main.js"></script>

</body>
</html>
