<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="src/styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Overpass:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <title>Thank You Page</title>
</head>
<body class="page">
    <section class="thank-you">
        <div class="thank-you__icon">
            <img src="./images/illustration-thank-you.svg" alt="thank you"/>
        </div>

        <div class="thank-you__result">
            You selected <span class="thank-you__rating"></span> out of 5
        </div>

        <div class="thank-you__content">
            <h1 class="thank-you__title">Thank you!</h1>
            <p class="thank-you__description">We appreciate you taking the time to give a rating. If you ever need more support, don’t hesitate to get in touch!</p>
        </div>

    </section>

    <script type="module" src="src/components/thank-you/thank-you.js"></script>
</body>
</html>
